#
# Jolla Tablet: let bluetoothd open /dev/uinput, so that buttons on a headset
# (play, pause, next) arrive as key presses. The node belongs to the Android
# group net_bt_stack with mode 0660, and bluetoothd runs without the capability
# that would let root ignore file permissions.
[Service]
SupplementaryGroups=net_bt_stack
