#
# Jolla Tablet backlight remap. Reload: systemctl reload tablet-backlight
# PWM on-time divisor: 255 (0xff) is the darkest, smaller is brighter.
# floor   = what the lowest slider position gives. 0xff: barely visible, moWerk's pick 2026-10-03.
# ceiling = what the highest slider position gives. 0x5d is the kernel driver's own maximum (64 % duty).
# gamma   = curve in between. 1.0 linear in duty; 2.2 spreads the slider evenly for the eye.
floor=0xff
ceiling=0x5d
gamma=2.2
